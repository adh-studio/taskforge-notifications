name: CI

# Integration continue du microservice de notifications.
# La toolchain PHP n'etant pas disponible sur le poste de developpement,
# c'est cette CI qui installe PHP et MySQL, verifie le schema de production
# et execute l'integralite de la suite de tests a chaque push.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: taskforge_notifications
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Recuperation du code
        uses: actions/checkout@v4

      - name: Installation de PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql, pdo_sqlite, mbstring, json
          coverage: none
          tools: composer:v2

      - name: Cache des dependances Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.json') }}
          restore-keys: composer-

      - name: Installation des dependances
        run: composer update --no-interaction --no-progress --prefer-dist

      - name: Attente de la disponibilite de MySQL
        run: |
          for i in $(seq 1 30); do
            if mysqladmin ping -h 127.0.0.1 -proot --silent; then
              echo "MySQL est pret."
              break
            fi
            echo "Attente de MySQL ($i)..."
            sleep 2
          done

      - name: Verification du schema de production (MySQL)
        run: |
          mysql -h 127.0.0.1 -uroot -proot taskforge_notifications < migrations/001_create_notifications.sql
          mysql -h 127.0.0.1 -uroot -proot taskforge_notifications -e "DESCRIBE notifications;"

      - name: Execution de la suite de tests (PHPUnit)
        run: vendor/bin/phpunit --colors=never
